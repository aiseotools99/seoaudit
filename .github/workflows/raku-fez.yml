name: Raku Fez Publish (raku.land)

on:
  push:
    branches: [main]
    paths:
      - 'raku/**'
      - '.github/workflows/raku-fez.yml'
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      FEZ_KEY: ${{ secrets.FEZ_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Raku & Zef
        uses: Raku/setup-raku@v1
        with:
          raku-version: 'latest'

      - name: Install Dependencies & Test
        run: |
          cd raku
          zef install --deps-only .
          zef test .

      - name: Install Fez Distribution Manager
        run: zef install fez

      - name: Review Distribution
        run: |
          cd raku
          fez review

      - name: Configure Fez Credentials & Publish to Raku.land
        if: env.FEZ_KEY != ''
        env:
          FEZ_KEY: ${{ secrets.FEZ_KEY }}
        run: |
          mkdir -p ~/.fez
          cat << EOF > ~/.fez-config.json
          {
            "groups": [],
            "un": "jaiganesh6999",
            "key": "$FEZ_KEY"
          }
          EOF
          cp ~/.fez-config.json ~/.fez/config.json
          chmod 600 ~/.fez-config.json ~/.fez/config.json
          export FEZ_CONFIG=~/.fez-config.json
          cd raku
          fez upload
